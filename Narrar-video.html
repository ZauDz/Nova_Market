<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narrar mi demostración</title><style>body{max-width:680px;margin:35px auto;padding:20px;background:#f7f5ef;color:#183a2f;font:17px/1.5 system-ui}video{display:block;width:100%;height:320px;background:#192c25;margin:20px 0}button,a{display:inline-block;padding:12px 20px;border:0;border-radius:9px;background:#244735;color:white}a[hidden]{display:none}</style><h1>Narrar mi demostración</h1><p>Selecciona el MP4 de Nova Market. Al empezar, el navegador pedirá acceso al micrófono. Habla mientras ves la demostración. Al terminar el video podrás descargar una copia con tu voz.</p><input id="file" type="file" accept="video/mp4"><video id="film" controls playsinline></video><button id="start" disabled>Grabar mi narración</button> <a id="result" hidden download="AP3_Diaz_Zaury.mp4">Descargar con mi voz</a><p id="status" role="status"></p><script>
const file=document.querySelector('#file'),film=document.querySelector('#film'),start=document.querySelector('#start'),result=document.querySelector('#result'),msg=document.querySelector('#status');
file.onchange=()=>{if(file.files[0]){film.src=URL.createObjectURL(file.files[0]);result.hidden=true;}};
film.onloadeddata=()=>{start.disabled=false;};
start.onclick=async()=>{
 let mic,track,rec;
 try{
  start.disabled=true;file.disabled=true;result.hidden=true;film.controls=false;
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported('video/mp4')||!film.captureStream)throw Error('Abre esta página en Chrome o Edge de escritorio.');
  mic=await navigator.mediaDevices.getUserMedia({audio:true,video:false});film.currentTime=0;
  await film.play();track=film.captureStream().getVideoTracks()[0];if(!track)throw Error('No se pudo capturar el video.');
  const stream=new MediaStream([track,...mic.getAudioTracks()]);rec=new MediaRecorder(stream,{mimeType:'video/mp4'});const parts=[];
  rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  rec.onstop=()=>{mic.getTracks().forEach(t=>t.stop());track.stop();result.href=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));result.hidden=false;start.disabled=false;file.disabled=false;film.controls=true;msg.textContent='Tu presentación está lista para descargar.';};
  film.onended=()=>{if(rec.state==='recording')rec.stop();};
  rec.start(1000);msg.textContent='Grabando tu voz. La grabación terminará con el video.';
 }catch(e){mic?.getTracks().forEach(t=>t.stop());track?.stop();film.pause();film.controls=true;start.disabled=false;file.disabled=false;msg.textContent=e.message;}
};</script></html>
